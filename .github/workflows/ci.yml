# The engine suite on both supported PHP lines. Free on public repositories.
name: CI

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, mbstring
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run the suite
        run: vendor/bin/phpunit
